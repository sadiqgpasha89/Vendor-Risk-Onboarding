version: '3.8'

services:
  # Application (will connect to other services)
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vendor_risk
      - REDIS_URL=redis://redis:6379
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=6831
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - APP_ENV=production
    depends_on:
      - postgres
      - redis
      - jaeger
      - prometheus
      - grafana
    networks:
      - observability

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendor_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - observability

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - observability

  # Jaeger for Distributed Tracing (OTLP compatible with Tempo)
  jaeger:
    image: jaegertracing/all-in-one:1.48
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "6831:6831/udp"     # Jaeger agent (thrift)
      - "14268:14268"       # Collector HTTP
      - "14250:14250"       # OTLP gRPC receiver
      - "16686:16686"       # Jaeger UI
    networks:
      - observability

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - observability
    depends_on:
      - app

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - observability
    depends_on:
      - prometheus
      - jaeger

  # Tempo for Long-term Trace Storage (optional, advanced)
  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"    # UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command:
      - '-config.file=/etc/tempo.yml'
    networks:
      - observability

  # Loki for Log Aggregation (optional, for centralized logging)
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  # AlertManager for Alert Management (optional)
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - observability

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_storage:
  tempo_data:
  loki_data:
  alertmanager_data:

networks:
  observability:
    driver: bridge
