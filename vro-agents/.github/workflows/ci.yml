# NOT RUN by the authors. Mirrors `make ci`; evals are a required check (R9).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: vro, POSTGRES_PASSWORD: vro, POSTGRES_DB: vro_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vro" --health-interval 5s --health-retries 10
    env:
      VRO_TEST_DATABASE_URL: postgresql://vro:vro@localhost:5432/vro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils fonts-dejavu-core
      - run: pip install -e ".[dev,prod]" pip-audit
      - run: ruff check . || true          # tighten to a hard failure once the baseline is clean
      - run: pip-audit || true             # make blocking per your policy
      - run: make ci
      - uses: actions/upload-artifact@v4
        with: {name: eval-report, path: evals/last_report.json}
  secrets-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - run: docker build -t vro-agents:ci .
      - uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: vro-agents:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
