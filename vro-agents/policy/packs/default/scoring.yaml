# Deterministic scoring & tiering (plan §15.2). Starting point; replace weights with the bank's policy (OQ-02).
scoring_version: "scoring-1.0.0"
weights:
  data_sensitivity: 0.20
  data_volume: 0.08
  access_type: 0.12
  business_criticality: 0.20
  substitutability: 0.08
  customer_facing: 0.07
  geo_risk: 0.07
  fourth_party: 0.05
  financial_materiality: 0.05
  regulatory_class: 0.08
scales:
  data_sensitivity: {none: 0.0, public: 0.1, internal: 0.3, confidential: 0.6, regulated_other: 0.8, customer_pii: 1.0, payment_card: 1.0, authentication_secrets: 1.0}
  data_volume: {none: 0.0, low: 0.2, medium: 0.5, high: 0.8, very_high: 1.0}
  access_type: {none: 0.0, read_only: 0.3, read_write: 0.6, privileged: 1.0, network_connectivity: 1.0}
  business_criticality: {low: 0.1, medium: 0.4, high: 0.7, critical: 1.0}
  substitutability: {easy: 0.1, moderate: 0.4, hard: 0.7, very_hard: 1.0}
geo_risk:
  default: 0.3
  low_risk: {US: 0.1, CA: 0.1, GB: 0.1, DE: 0.1, FR: 0.1, NL: 0.1, IE: 0.1, IN: 0.2, SG: 0.1, CH: 0.1}
  high_risk: [KP, IR, SY, CU, RU, BY, MM]   # illustrative; the bank's country-risk table is the source of truth
  high_risk_score: 0.95
fourth_party:
  per_subcontractor: 0.2
  cap: 1.0
financial_materiality:   # annual spend USD -> factor
  - {max: 50000, value: 0.1}
  - {max: 250000, value: 0.3}
  - {max: 1000000, value: 0.6}
  - {max: null, value: 1.0}
tiers:   # inherent score thresholds
  t1_min: 70
  t2_min: 50
  t3_min: 30
floors:   # tier cannot be less risky than this number (1 is most risky)
  regulatory_critical: 2
  pii_and_privileged: 2
  payment_card: 2
control_domain_weights: {security: 0.35, resilience: 0.15, privacy: 0.15, contract: 0.20, financial: 0.15}
residual_bands: {low_max: 20, medium_max: 40, high_max: 60}   # above high_max => CRITICAL
critical_finding_min_band: HIGH
high_finding_floor: {one_band: MEDIUM, many_count: 3, many_band: HIGH}   # extension to plan 15.2 - see ADR-0006
